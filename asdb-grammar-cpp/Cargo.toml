[package]
name    = "asdb-grammar-cpp"
version = "0.1.0"
edition = "2024"
description = "tree-sitter C++ grammar packaged as a C-ABI DLL for asdb"

[lib]
# Output filename: asdb_grammar_cpp.dll / libasdb_grammar_cpp.so
# derive_fn_name("asdb_grammar_cpp.dll") → "asdb_grammar_cpp", matching our export below.
# We cannot use "tree_sitter_cpp" here because that name collides with the C symbol in
# parser.c (from the tree-sitter-cpp crate), causing the linker to drop the C definition
# and create infinite recursion when our wrapper calls grammar::LANGUAGE.into().
name      = "asdb_grammar_cpp"
crate-type = ["cdylib"]

[dependencies]
tree-sitter     = "0.24"
tree-sitter-cpp = "0.23.4"
