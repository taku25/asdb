[workspace]
members = ["asdb-cli", "asdb-grammar-cpp"]
resolver = "2"

[package]
name = "asdb"
version = "0.1.0"
edition = "2024"

[dependencies]
libloading        = "0.8"
tree-sitter       = "0.24"
streaming-iterator = "0.1"
anyhow            = "1"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
rusqlite          = { version = "0.31", features = ["bundled"] }
rayon             = "1"
walkdir           = "2"
sha2              = "0.10"
hex               = "0.4"
