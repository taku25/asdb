[package]
name = "asdb-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "asdb-cli"
path = "src/main.rs"

[dependencies]
anyhow    = "1"
clap      = { version = "4", features = ["derive"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
toml      = "0.8"
ureq      = { version = "2", features = ["json"] }
tempfile  = "3"
sha2      = "0.10"
hex       = "0.4"
